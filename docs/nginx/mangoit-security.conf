# it.mangonese.dev security headers (ManGO:IT 1.18.8, 2026-11-21).
# Included at server level AND inside every location that sets its own
# add_header (nginx drops inherited headers there). Firebase helper locations
# (/__/) and gsi-return.html keep their own headers untouched.
# SAMEORIGIN, not DENY: Firebase Auth frames this origin's /__/auth/iframe.
# CSP ENFORCED since 2026-11-23, after a report-only run (reports go to the shared csp log); enforce
# once a real sign-in and a map session have produced no reports.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-BQUM9p2Yk2iUP4veUUfat02QCltn+OzvIgPokOeFOfk=' 'sha256-TrY3rAdDvzzEvZMDViu1x+R2xT/kKOUOnhw2ueyZPvk=' https://www.gstatic.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://mangonese.dev https://accounts.google.com; font-src 'self' https://mangonese.dev data:; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.basemaps.cartocdn.com https://www.gstatic.com https://accounts.google.com https://mangonese.dev; frame-src 'self' https://accounts.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri https://blueline.mangonese.dev/api/csp-report" always;

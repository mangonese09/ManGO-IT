# 2026-11-23 security review: the ManGO:IT API had no brake. Per address 5 r/s; bursts cover a map pan or a search.
# 2026-11-25: the all-callers cap was 10 r/s, so two scripts at 5 r/s locked everyone out. Raised to 30.
# Address lookups (Nominatim, 1 r/s usage policy) get their own 1 r/s per address and a day of cache.
limit_req_zone $binary_remote_addr zone=mangoit_api:10m rate=5r/s;
limit_req_zone $server_name zone=mangoit_api_all:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=mangoit_geo:10m rate=1r/s;
proxy_cache_path /var/cache/nginx/mangoit-geo levels=1:2 keys_zone=mangoit_geo_cache:10m max_size=200m inactive=7d use_temp_path=off;

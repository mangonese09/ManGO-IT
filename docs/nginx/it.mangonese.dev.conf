server {
    server_name it.mangonese.dev;
    root /var/www/mangoit;
    index index.html;
    include snippets/mangoit-security.conf;

    location ~ ^/api/(geocode|rev)$ {
        limit_req zone=mangoit_geo burst=6 nodelay;
        limit_req zone=mangoit_api_all burst=200 nodelay;
        limit_req_status 429;
        proxy_cache mangoit_geo_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_pass http://127.0.0.1:3041;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Powered-By;
        include snippets/mangoit-security.conf;
    }

    location /api/ {
        limit_req zone=mangoit_api burst=40 nodelay;
        limit_req zone=mangoit_api_all burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3041;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        # 2026-11-23: the app is same-origin (the Android shell loads this site),
        # so no page on another site needs to read these answers.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Powered-By;
        include snippets/mangoit-security.conf;
    }

    # v0.9.5: static cache lifetimes — SW cache:reload + ?v= busters make these safe
    location = /service-worker.js { include snippets/mangoit-security.conf; add_header Cache-Control "no-cache"; }
    location = /version.json      { include snippets/mangoit-security.conf; add_header Cache-Control "no-cache"; }
    location = /index.html        { include snippets/mangoit-security.conf; add_header Cache-Control "no-cache"; }
    location ~* \.(png|svg|jpg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/mangoit-security.conf;
    }
    # 1.18.8: ES modules import each other by bare path (no ?v=), so they
    # revalidate every time (ETag 304s); ?v=-busted css keeps its day cache
    location ^~ /js/ {
        include snippets/mangoit-security.conf;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include snippets/mangoit-security.conf;
    }

    # Firebase Auth helper pages (/__/auth/*, /__/firebase/init.json) served same-site, so Google
    # sign-in survives Chrome storage partitioning; authDomain in the app points here (2026-11-19)
    # 1.18.4: Google returns the redirect sign-in here (id_token in the fragment, so no query);
    # Firebase helper traffic always carries a query and still goes to Firebase.
    location = /__/auth/handler {
        if ($args = "") { rewrite ^ /gsi-return.html last; }
        proxy_pass https://mango-blueline-2026.firebaseapp.com;
        proxy_set_header Host mango-blueline-2026.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_ssl_name mango-blueline-2026.firebaseapp.com;
    }
    location = /gsi-return.html {
        add_header Cache-Control "no-store"; add_header Referrer-Policy no-referrer;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location ^~ /__/ {
        proxy_pass https://mango-blueline-2026.firebaseapp.com;
        proxy_set_header Host mango-blueline-2026.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_ssl_name mango-blueline-2026.firebaseapp.com;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/it.mangonese.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/it.mangonese.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = it.mangonese.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name it.mangonese.dev;
    return 404; # managed by Certbot


}
  </g>
  <!-- teal tree -->
  <circle cx="35" cy="27.5" r="4.2" fill="#3dd6ac"/>
  <rect x="34.2" y="30" width="1.6" height="4" rx="0.8" fill="#0f8a7e"/>
</svg>

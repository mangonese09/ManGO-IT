    <radialGradient id="twg" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f8c820"/>
      <stop offset="55%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#c97f00"/>
    </radialGradient>
  </defs>
  <!-- back house -->
  <g>
    <rect x="21" y="16" width="13" height="16" rx="1.5" fill="url(#twg)" opacity="0.82"/>
    <path d="M19.5 17 27.5 9.5 35.5 17z" fill="#c97f00"/>
    <rect x="25.5" y="20" width="4" height="4" rx="0.8" fill="#0d1117" opacity="0.55"/>
  </g>
  <!-- front house -->
  <g>
    <rect x="6" y="19" width="14" height="13" rx="1.5" fill="url(#twg)"/>
    <path d="M4.5 20 13 12.5 21.5 20z" fill="#f0a500"/>

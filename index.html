<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title>ManGO:IT</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://mangonese.dev">
  <link rel="preconnect" href="https://mangonese.dev" crossorigin>
  <link rel="stylesheet" href="https://mangonese.dev/shared/mangonese.css">
  <link rel="stylesheet" href="/css/styles.css?v=1.10.2">
</head>
<body>
  <header class="app-header">
    <img class="logo-img" src="/icons/logo.png" alt="">
    <span class="logo">ManGO<span class="logo-it">:IT</span></span>
  </header>

  <main>
    <!-- ── HOME ── -->
    <section id="view-home">
      <div class="search-box card">
        <div class="endpoint-stack">
          <div class="endpoint-row">
            <input id="from-input" type="text" placeholder="From" autocomplete="off" enterkeyhint="search">
            <button id="from-clear" class="field-clear" aria-label="Clear From" hidden>&#10005;</button>
            <div id="from-suggest" class="suggest" hidden></div>
          </div>
          <div class="endpoint-divider"></div>
          <div class="endpoint-row">
            <input id="to-input" type="text" placeholder="To" autocomplete="off" enterkeyhint="search">
            <button id="to-clear" class="field-clear" aria-label="Clear To" hidden>&#10005;</button>
            <div id="to-suggest" class="suggest" hidden></div>
          </div>
          <button id="swap-btn" class="swap-btn" aria-label="Swap From and To">⇅</button>
        </div>
        <div class="when-row">
          <button id="when-toggle" class="btn btn-ghost"><span>Depart</span></button>
          <button id="when-display" class="btn btn-ghost when-display" aria-label="Choose date and time (Italy time)">Now</button>
          <button id="when-clear" class="field-clear when-clear" aria-label="Reset to now" hidden>&#10005;</button>
          <input id="when-input" type="datetime-local" class="when-native" aria-hidden="true" tabindex="-1">
        </div>
        <div class="mode-row" role="group" aria-label="Modes to include">
          <button id="mode-train" class="mode-toggle active" aria-pressed="true">
            <img src="/icons/modes/train.png" alt=""><span>Trains</span>
          </button>
          <button id="mode-bus" class="mode-toggle active" aria-pressed="true">
            <img src="/icons/modes/bus.png" alt=""><span>Buses &amp; coaches</span>
          </button>
        </div>
        <p class="muted when-tz">Blank = leave now · times are Italy time</p>
        <button id="search-btn" class="btn btn-primary btn-wide">Find routes</button>
        <div id="recents" class="recents"></div>
      </div>

      <div id="results"></div>

      <div class="board-head">
        <h2>Nearby departures</h2>
        <button id="board-refresh" class="btn btn-ghost btn-small" aria-label="Refresh">↻</button>
      </div>
      <div id="board"></div>
    </section>

    <!-- ── SAVED ── -->
    <section id="view-saved" hidden>
      <h2>Saved</h2>
      <h3 class="saved-subhead">Places</h3>
      <button id="place-add-toggle" class="add-toggle">+ Add a place</button>
      <div id="place-search-card" class="search-box card fav-search" hidden>
        <div class="endpoint-row">
          <input id="place-input" type="text" placeholder="Add a place — home, a town or an address" autocomplete="off" enterkeyhint="search">
          <div id="place-suggest" class="suggest" hidden></div>
        </div>
      </div>
      <div id="fav-places"></div>
      <h3 class="saved-subhead">Stops</h3>
      <button id="fav-add-toggle" class="add-toggle">+ Add a stop</button>
      <div id="fav-search-card" class="search-box card fav-search" hidden>
        <div class="endpoint-row">
          <input id="fav-input" type="text" placeholder="Add a stop — bus, coach or train" autocomplete="off" enterkeyhint="search">
          <div id="fav-suggest" class="suggest" hidden></div>
        </div>
      </div>
      <div id="fav-stops"></div>
      <div id="fav-lines"></div>
      <div id="saved-list"></div>
    </section>

    <!-- ── MAP ── -->
    <section id="view-map" hidden>
      <div id="map-list"></div>
    </section>

    <!-- ── SETTINGS ── (v1.5.0 deep-dive redesign: grouped, whole-row taps,
         value-as-text rows opening choice sheets; cache clear split from
         data erase) -->
    <section id="view-settings" hidden>
      <h2>Settings</h2>
      <h3 class="settings-group">Preferences</h3>
      <div class="card settings-card">
        <button id="theme-row" class="setting-row setting-link" aria-haspopup="dialog">
          <span>Theme</span>
          <span class="setting-value"><span id="theme-value"></span><span class="setting-chevron" aria-hidden="true">›</span></span>
        </button>
        <div class="setting-sep"></div>
        <button id="map-style-row" class="setting-row setting-link" aria-haspopup="dialog">
          <span>Map style</span>
          <span class="setting-value"><span id="map-style-value"></span><span class="setting-chevron" aria-hidden="true">›</span></span>
        </button>
        <div class="setting-sep"></div>
        <button id="span-row" class="setting-row setting-link" aria-haspopup="dialog">
          <span>Search results</span>
          <span class="setting-value"><span id="span-value"></span><span class="setting-chevron" aria-hidden="true">›</span></span>
        </button>
      </div>
      <h3 class="settings-group">Data</h3>
      <div class="card settings-card">
        <button id="data-info" class="setting-row setting-link" aria-haspopup="dialog">
          <span>Data &amp; schedules</span>
          <span class="setting-chevron" aria-hidden="true">›</span>
        </button>
        <div class="setting-sep"></div>
        <button id="check-updates" class="setting-row setting-link">
          <span>Check for updates <span class="muted setting-ver" id="current-version"></span></span>
        </button>
        <div class="setting-sep"></div>
        <button id="backup-data" class="setting-row setting-link">
          <span>Back up my data</span>
        </button>
        <div class="setting-sep"></div>
        <button id="restore-data" class="setting-row setting-link">
          <span>Restore from backup</span>
        </button>
        <input id="restore-file" type="file" accept="application/json,.json" class="when-native" aria-hidden="true" tabindex="-1">
        <div class="setting-sep"></div>
        <button id="clear-cache" class="setting-row setting-link">
          <span>Clear cached schedules</span>
        </button>
        <div class="setting-sep"></div>
        <button id="erase-all" class="setting-row setting-link setting-danger">
          <span>Erase all data</span>
        </button>
      </div>
      <div class="card settings-card settings-about-card">
        <button id="about-open" class="setting-row setting-link" aria-haspopup="dialog">
          <span>About ManGO:IT</span>
          <span class="setting-chevron" aria-hidden="true">›</span>
        </button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button id="nav-home" class="nav-btn active" aria-label="Home">
      <img src="/icons/home.png" alt="" width="26" height="26">
    </button>
    <button id="nav-saved" class="nav-btn" aria-label="Saved">
      <img src="/icons/mango-star.svg" alt="" width="26" height="26">
    </button>
    <button id="nav-map" class="nav-btn" aria-label="Map">
      <img src="/icons/place-pin.png" alt="" width="26" height="26">
    </button>
    <button id="nav-settings" class="nav-btn" aria-label="Settings">
      <img src="/icons/gear.svg" alt="" width="26" height="26">
    </button>
  </nav>

  <script>
    // Self-heal OUTSIDE the module graph (v1.5.1). A half-updated cache can
    // pair modules whose imports no longer line up — then the ES-module graph
    // fails to even evaluate and nothing inside app.js ever runs. The service
    // worker registration and the one-shot reload that REPAIRS the tear must
    // therefore live here, in a plain script that always executes.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(function () { /* offline first load */ });
      var swHadController = !!navigator.serviceWorker.controller;
      var swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!swHadController || swReloaded) return;
        swReloaded = true;
        location.reload();
      });
    }
  </script>
  <script type="module" src="/js/app.js?v=1.10.2"></script>
</body>
</html>
